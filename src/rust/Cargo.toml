[package]
name = "selectrs"
# Kept in lockstep with the R package version (DESCRIPTION) — bump both
# together. Cargo requires three-component semver, so R's fourth
# (development) component rides as a pre-release suffix: 0.0.0.9000 here
# is 0.0.0-9000. The test suite enforces the match via
# selectrs_core_version().
version = "0.0.0-9000"
edition = "2024"
# The floor is set by savvy 0.10.2 (rust-version 1.88), the newest
# requirement in the pinned dependency tree; configure enforces the same
# minimum with an actionable error message.
rust-version = "1.88"

[lib]
crate-type = ["staticlib", "lib"]

# An empty table stops cargo walking parent directories for a workspace
# root, which would otherwise absorb this build when the package source
# sits under an unrelated Rust workspace.
[workspace]

[dependencies]
savvy = "=0.10.2"
# Path dependency for the interim co-located layout; switches to a
# crates.io version pin once the crate is published and the in-tree
# directory is removed.
css-to-xpath = "=0.1.0"

[profile.release]
# The entire input surface is arbitrary user-supplied CSS flowing into
# third-party parsing code, so a reachable panic must surface as a
# catchable R error (savvy converts unwinds), not kill the R session.
# The wasm build is the exception: src/Makevars.in forces abort there,
# where unwinding across the emscripten FFI isn't an option.
panic = "unwind"
