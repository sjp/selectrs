[package]
name = "selectrs"
version = "0.1.0"
edition = "2024"
# The floor is set by savvy 0.10.2 (rust-version 1.88), the newest
# requirement in the pinned dependency tree; configure enforces the same
# minimum with an actionable error message.
rust-version = "1.88"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
# Exact pins: `selectors` is a 0.x crate tied to Servo's needs, and CRAN
# vendoring freezes the dependency tree anyway. Upgrades are deliberate
# events, gated on the full test suite.
savvy = "=0.10.2"
selectors = "=0.38.0"
cssparser = "=0.37.0"
precomputed-hash = "=0.1.1"

[profile.release]
# The entire input surface is arbitrary user-supplied CSS flowing into
# third-party parsing code, so a reachable panic must surface as a
# catchable R error (savvy converts unwinds), not kill the R session.
# The wasm build is the exception: src/Makevars.in forces abort there,
# where unwinding across the emscripten FFI isn't an option.
panic = "unwind"
