on:
  push:
    branches: [master]
  pull_request:

name: r-cmd-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # R on Windows compiles with the Rtools (GNU) toolchain, but the
      # runner's default Rust host target is MSVC.
      - name: Add the Windows GNU target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # There are no vignettes, so the template's --compact-vignettes is
      # dropped along with its Ghostscript/qpdf expectations.
      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual")'

  # The job above builds from crates.io, because src/rust/vendor.tar.xz is
  # not in the repository. CRAN builds the other half of src/Makevars.in:
  # the archive is present, so the crates are extracted from it and cargo
  # runs --offline against a throwaway CARGO_HOME. Build the tarball the
  # way a release does and check it with cargo's network access switched
  # off, so a stale Cargo.lock, a crate that cannot be vendored, or a bug
  # in the extraction fails here rather than on CRAN.
  vendored-check:
    runs-on: ubuntu-latest

    name: vendored (CRAN) build

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Vendor the crate dependencies
        run: sh tools/vendor-crates.sh

      - name: Build the source tarball
        run: R CMD build .

      # Without this the tarball could silently lose the archive and the
      # check below would fall back to the registry, which the vendoring
      # step has just warmed.
      - name: Assert the tarball ships the vendored crates
        run: tar --list --file selectrs_*.tar.gz | grep -qx 'selectrs/src/rust/vendor.tar.xz'

      - name: Check the tarball with cargo offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          tarball <- Sys.glob("selectrs_*.tar.gz")
          stopifnot(length(tarball) == 1L)
          rcmdcheck::rcmdcheck(
            tarball,
            args = "--no-manual",
            error_on = "warning",
            check_dir = "check"
          )
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vendored-check-results
          path: check

  # Files that are generated from something else in the repository:
  # NAMESPACE and man/ from the roxygen comments, inst/AUTHORS from
  # Cargo.lock, and the crate version from DESCRIPTION. Regenerate each
  # and fail if the committed copy differs.
  document-check:
    runs-on: ubuntu-latest

    name: generated files in sync

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Cargo requires three-component semver, so R's fourth (development)
      # component rides as a pre-release suffix: 0.0.0.9000 is 0.0.0-9000.
      - name: Check the crate version mirrors DESCRIPTION
        run: |
          r=$(sed -n 's/^Version: *//p' DESCRIPTION)
          case "$r" in
            *.*.*.*) expected=$(echo "$r" | sed 's/\.\([^.]*\)$/-\1/') ;;
            *) expected=$r ;;
          esac
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' src/rust/Cargo.toml | head -1)
          if [ "$crate" != "$expected" ]; then
              echo "Cargo.toml has $crate, DESCRIPTION $r wants $expected" >&2
              exit 1
          fi

      # The minimum Rust version is stated in four places: rust-version in
      # Cargo.toml, MIN_RUST_VERSION in the two configure scripts, and
      # SystemRequirements in DESCRIPTION. A dependency bump that raises
      # the floor has to move all four.
      - name: Check the minimum Rust version is stated consistently
        run: |
          minor() { echo "$1" | cut -d. -f1,2; }
          want=$(minor "$(sed -n 's/^rust-version = "\(.*\)"/\1/p' src/rust/Cargo.toml)")
          fail=0
          check() {
              if [ "$(minor "$2")" != "$want" ]; then
                  echo "$1 states \"$2\", Cargo.toml states $want" >&2
                  fail=1
              fi
          }
          check configure "$(sed -n 's/^MIN_RUST_VERSION="\(.*\)"/\1/p' configure)"
          check configure.win "$(sed -n 's/^MIN_RUST_VERSION="\(.*\)"/\1/p' configure.win)"
          check DESCRIPTION "$(sed -n 's/^SystemRequirements:.*rustc (>= \([0-9.]*\)).*/\1/p' DESCRIPTION)"
          [ "$fail" = 0 ]

      # cargo metadata resolves the pinned tree tools/generate-authors.R
      # reads; no Rust code is compiled by this job.
      - uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2, any::jsonlite

      # load_code = "source" sidesteps compiling the Rust core: roxygen
      # only needs the R sources to regenerate NAMESPACE and man/.
      - name: Regenerate NAMESPACE and man/
        run: Rscript -e 'roxygen2::roxygenise(load_code = "source")'

      - name: Regenerate inst/AUTHORS
        run: Rscript tools/generate-authors.R

      - name: Fail on drift
        run: git diff --exit-code NAMESPACE man/ inst/AUTHORS
