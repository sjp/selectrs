on:
  push:
    branches: [master]
  pull_request:

name: rust-checks

permissions: read-all

defaults:
  run:
    working-directory: src/rust

jobs:
  rust-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      # savvy's build script compiles a small C shim against the R headers,
      # so clippy and the unit tests need R installed and R_INCLUDE_DIR set.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set R_INCLUDE_DIR
        run: echo "R_INCLUDE_DIR=$(Rscript -e 'cat(normalizePath(R.home("include")))')" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
